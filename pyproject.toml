[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mddatanet"
version = "0.1.0"
description = "CLI for converting molecular dynamics simulations into labeled, ML-ready dataset packages."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Leon Chien", email = "maintainers@mddatanet.org" }
]
keywords = ["molecular-dynamics", "machine-learning", "datasets", "zarr", "mdanalysis"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "MDAnalysis>=2.7",
  "numpy>=1.24",
  "zarr>=2.16",
  "numcodecs>=0.12",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "build>=1.2",
]
ml = [
  "scikit-learn>=1.4",
]

[project.scripts]
mddatanet = "mddatanet.cli:app"

[project.urls]
Homepage = "https://github.com/leon-chien/mddn-cli"
Repository = "https://github.com/leon-chien/mddn-cli"
Issues = "https://github.com/leon-chien/mddn-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mddatanet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]
